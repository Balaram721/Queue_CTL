[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "queuectl"
version = "0.1.0"
description = "A CLI-based background job queue system with retries, DLQ, and crash recovery"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
queuectl = "queuectl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
